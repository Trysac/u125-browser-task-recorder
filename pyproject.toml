[project]
name = "trysac-browser-task-recorder"
dynamic = ["version"]
description = "Turn recorded browser steps, including Chrome DevTools Recorder JSON exports, into reproducible Playwright Python scripts with safe literals and secrets moved to environment variables"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Miguel Gomez" }]
keywords = ["browser-task-recorder"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
browser-task-recorder = "browser_task_recorder.__main__:main"

[project.urls]
Homepage = "https://github.com/Trysac/u125-browser-task-recorder"
Source = "https://github.com/Trysac/u125-browser-task-recorder"
Issues = "https://github.com/Trysac/u125-browser-task-recorder/issues"
Changelog = "https://github.com/Trysac/u125-browser-task-recorder/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/browser_task_recorder/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/browser_task_recorder"]

[tool.hatch.build.targets.sdist]
# Ship the library, its tests and its docs; never the factory's internal files.
include = ["src", "tests", "docs", "README.md", "LICENSE", "CHANGELOG.md", "SECURITY.md"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "RUF"]
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "E501"]  # verbatim acceptance literals may be long (L29)

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["browser_task_recorder"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
